name: Build Push Docker

on:
  workflow_call:
    secrets:
      LAMEDUSE_REGISTRY_USERNAME:
        required: true
        description: 'Lameduse registry username'
      LAMEDUSE_REGISTRY_TOKEN:
        required: true
        description: 'Lameduse registry token'
    inputs:
      TARGET_DIR:
        required: false
        type: string
        description: 'Target directory in the registry'
        default: 'restricted'
      DIRECTORIES:
        required: false
        type: string
        description: 'JSON array of directories to build from. Defaults to ["."].'
        default: '["."]'

    # vars:
    #   LAMEDUSE_REGISTRY:
    #     required: true
    #     description: 'Lameduse registry URL'

env:
  IMAGE_NAME: ${{ inputs.TARGET_DIR }}/${{ github.repository }}
  REGISTRY: ${{ vars.LAMEDUSE_REGISTRY }}

concurrency:
  group: build-push-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: lameduse-runners
    strategy:
      fail-fast: false
      matrix:
        context: ${{ fromJson(inputs.DIRECTORIES) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.LAMEDUSE_REGISTRY_USERNAME }}
          password: ${{ secrets.LAMEDUSE_REGISTRY_TOKEN }}
      - name: Compute Image Name
        id: compute-image-name
        env:
          BASE_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTEXT: ${{ matrix.context }}
        run: |
          if [ "$CONTEXT" = "." ]; then
            echo "result=$BASE_IMAGE_NAME" >> "$GITHUB_OUTPUT"
          else
            SUFFIX=$(basename "$CONTEXT")
            echo "result=$BASE_IMAGE_NAME/$SUFFIX" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.compute-image-name.outputs.result }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
